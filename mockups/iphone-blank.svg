<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Blank iPhone Mockup</title>
  <desc id="desc">Editable vector iPhone mockup with an empty screen.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="0.5" stop-color="#101114"/>
      <stop offset="1" stop-color="#303136"/>
    </linearGradient>
  </defs>

  <!-- Device body -->
  <rect id="device" x="15" y="8" width="400" height="916" rx="58" fill="url(#frame)" filter="url(#shadow)"/>
  <rect id="bezel" x="24" y="17" width="382" height="898" rx="51" fill="#050506"/>

  <!-- Editable screen -->
  <rect id="screen" x="31" y="24" width="368" height="884" rx="45" fill="#ffffff"/>

  <!-- Dynamic Island -->
  <rect id="dynamic-island" x="139" y="38" width="152" height="43" rx="22" fill="#050506"/>
  <circle id="front-camera" cx="268" cy="59" r="5" fill="#15171b"/>

  <!-- Side buttons -->
  <g id="buttons" fill="#191a1e">
    <rect x="7" y="183" width="8" height="82" rx="4"/>
    <rect x="7" y="282" width="8" height="55" rx="4"/>
    <rect x="415" y="220" width="8" height="108" rx="4"/>
  </g>

  <!-- Home indicator -->
  <rect id="home-indicator" x="154" y="883" width="122" height="5" rx="3" fill="#111216" opacity="0.8"/>

  <!-- Optional editable content group: put your UI here -->
  <g id="screen-content"></g>
</svg>
