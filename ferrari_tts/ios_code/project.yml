name: Ferrari
options:
  bundleIdPrefix: com.ferrari
targets:
  Ferrari:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources, Resources]
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreML.framework
      - sdk: Speech.framework
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: "Ferrari needs the microphone to hear your commands."
        NSSpeechRecognitionUsageDescription: "Ferrari uses on-device speech recognition to transcribe your voice."
        NSLocalNetworkUsageDescription: "Ferrari connects to the Orchestrator on your local network."
        NSBonjourServices:
          - _antigravity._tcp.
        UIBackgroundModes: [audio]
        UILaunchStoryboardName: LaunchScreen
