name: Deploy iPhone Mockup to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'mockups/**'
      - '.github/workflows/deploy-mockup-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R mockups _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferrari iPhone Mockups</title></head>
          <body style="margin:0;background:#e9e9ed;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif">
            <main style="text-align:center">
              <h1>Ferrari iPhone Mockup</h1>
              <p><a href="mockups/iphone-interactive.html">Open interactive mockup →</a></p>
            </main>
          </body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
